version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI}
      - PORT=5000
    networks:
      - mern-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: mern-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - mern-network
    depends_on:
      - backend

networks:
  mern-network:
    driver: bridge